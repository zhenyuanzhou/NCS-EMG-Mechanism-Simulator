        text: { zh: '<p>CMAP 是所有被激活肌纤维电位的总和（p.23）。每个运动单位贡献一份；潜伏期只取决于最快的纤维。</p>', en: '<p>The CMAP is the sum of all activated muscle-fibre potentials (p.23). Each motor unit contributes one share; latency depends only on the fastest fibres.</p>' },

// Small numeric helpers shared by all layers.

const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};

function zeros(n) {
  return new Float64Array(n);
}

// Add src (sampled at the same dt) into dst with a delay given in samples (fractional allowed).
function addShifted(dst, src, delaySamples, gain = 1) {
  if (gain === 0) return;
  const i0 = Math.floor(delaySamples);
  const f = delaySamples - i0;
  const n = dst.length;
  const m = src.length;
  for (let k = 0; k < m; k++) {
    const v = src[k] * gain;
    const j = i0 + k;
    if (j >= 0 && j < n) dst[j] += v * (1 - f);
    if (j + 1 >= 0 && j + 1 < n) dst[j + 1] += v * f;
  }
}

// Linear interpolation of a sampled array at fractional index.
function sampleAt(arr, idx) {
  if (idx <= 0) return arr[0];
  const n = arr.length;
  if (idx >= n - 1) return arr[n - 1];
  const i = Math.floor(idx);
  const f = idx - i;
  return arr[i] * (1 - f) + arr[i + 1] * f;
}

function mean(a) {
  let s = 0;
  for (const v of a) s += v;
  return a.length ? s / a.length : 0;
}

function sd(a) {
  const m = mean(a);
  let s = 0;
  for (const v of a) s += (v - m) * (v - m);
  return a.length > 1 ? Math.sqrt(s / (a.length - 1)) : 0;
}

  if (x === null || x === undefined || Number.isNaN(x)) return '—';
  if (!Number.isFinite(x)) return '—';
  return x.toFixed(digits);
}

function pctChange(a, b) {
  if (!a) return null;
  return ((b - a) / a) * 100;
}

}
function setPath(obj, path, value) {

  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];

}

    clamp,
    lerp,
    smoothstep,
    zeros,
    addShifted,
    sampleAt,
    mean,
    sd,
    fmt,
    pctChange,

    setPath

    out.push(L(`离断的轴突远端残端发生沃勒变性：运动纤维 ${motorDegen}（3–5 天），感觉纤维 ${sensDegen}（6–10 天）。变性前，远端仍可被刺激并传导（p.34–35）。`, `Distal stumps of transected axons undergo Wallerian degeneration: motor ${motorDegen} (days 3–5), sensory ${sensDegen} (days 6–10). Before that, the distal stump can still be stimulated and conducts (p.34–35).`));
  }
  if (p.demyel.on) {
    if (p.demyel.site === 'diffuse') out.push(L('所有节段髓鞘均一受损 → 每根轴突都同样减慢；轴突间差异不明显增加，故波形形态在近远端间相似（p.34 Fig 3.16C）。', 'All internodes uniformly affected → every axon slows similarly; little extra variation between axons, so morphology is similar between sites (p.34, Fig 3.16C).'));
    else if (p.demyel.mechanism === 'nodal') out.push(L('结区/旁结区功能障碍可在髓鞘大体完整时造成传导失败，几乎不伴减速；可迅速可逆（p.503“nodopathy”概念）。', 'Nodal/paranodal dysfunction can cause conduction failure with little slowing and without gross demyelination; may reverse quickly (p.503, “nodopathy”).'));
    else out.push(L('脱髓鞘的结间段：跳跃式传导变慢或失败。各轴突受累程度不同 → 到达时间分散（时间离散）；部分轴突完全不能通过病灶（传导阻滞）。轴突本身完整，不发生沃勒变性（p.35–38）。', 'Demyelinated internodes: saltatory conduction slows or fails. Axons are affected unequally → arrival times spread (temporal dispersion); some cannot pass at all (conduction block). Axons stay intact, no Wallerian degeneration (p.35–38).'));
  }
  if (p.myopathy.on) out.push(L('轴突、神经肌肉接头数目正常；每个运动单位内能产生动作电位的肌纤维减少。', 'Axons and NMJ counts are normal; fewer muscle fibres per unit generate action potentials.'));
  return out.length ? out.join(' ') : L('所有有髓轴突以 35–65 m/s 传导；CMAP = 所有肌纤维电位之和，SNAP = 所有感觉纤维电位之和（p.23–26）。', 'Myelinated axons conduct at 35–65 m/s; the CMAP sums all muscle-fibre potentials, the SNAP all sensory-fibre potentials (p.23–26).');
}

function explain(r, p) {
  const motor = p.study === 'motor';
  const rows = r.rows;
  const d0 = rows[0];
  const sp = rows.map((row) => ({ key: row.key, ab: spread(row.ab.arrivals), nm: spread(row.nm.arrivals) }));
  const nTot = motor ? r.sc.subj.nerve.motor.length : r.sc.subj.nerve.sensory.length;
  const srcTxt = sp
    .map((s) => L(`${STIM_SITES[s.key].zh}刺激：${s.ab.n}/${nTot} 条${motor ? '运动轴突的运动单位' : '感觉轴突'}到达（正常 ${s.nm.n}）；到达时间 10–90% 跨度 ${fmt(s.ab.range, 2)} ms（正常 ${fmt(s.nm.range, 2)} ms）`, `${STIM_SITES[s.key].en}: ${s.ab.n}/${nTot} ${motor ? 'motor units' : 'sensory axons'} arrive (normal ${s.nm.n}); 10–90% arrival spread ${fmt(s.ab.range, 2)} ms (normal ${fmt(s.nm.range, 2)} ms)`))
    .join('<br>');
  const wf = rows
    .map((row) => {
      const a = row.mAb;
      const n = row.mNm;
      if (!a.present) return L(`${STIM_SITES[row.key].zh}：无可测反应`, `${STIM_SITES[row.key].en}: no measurable response`);
      return L(
        `${STIM_SITES[row.key].zh}：波幅 ${ampTxt(r, a.amp)}（${fmt(pctChange(n.amp, a.amp), 0)}%），面积 ${fmt(pctChange(n.area, a.area), 0)}%，时程 ${fmt(a.duration, 2)} ms（正常 ${fmt(n.duration, 2)}），潜伏期 ${fmt(a.onset, 2)} ms`,
        `${STIM_SITES[row.key].en}: amplitude ${ampTxt(r, a.amp)} (${fmt(pctChange(n.amp, a.amp), 0)}%), area ${fmt(pctChange(n.area, a.area), 0)}%, duration ${fmt(a.duration, 2)} ms (normal ${fmt(n.duration, 2)}), onset ${fmt(a.onset, 2)} ms`
      );
    })
    .join('<br>');
  // interpretation
  const interp = [];
  const minCV = Math.min(...r.segs.map((s) => s.cvAb ?? Infinity), r.sensCV?.ab ?? Infinity);
  if (Number.isFinite(minCV) && minCV < 35) interp.push(L(`<b>节段传导速度 ${fmt(minCV, 0)} m/s &lt; 35 m/s（上肢）</b>：按教科书属于明确的脱髓鞘范围（p.35）。`, `<b>Segment CV ${fmt(minCV, 0)} m/s &lt; 35 m/s (arm)</b>: unequivocally in the demyelinating range per the textbook (p.35).`));
  for (let i = 1; i < rows.length; i++) {
    const a = rows[i - 1].mAb;
    const b = rows[i].mAb;
    if (!a.present) continue;
    const ampDrop = b.present ? (100 * (a.amp - b.amp)) / a.amp : 100;
    const areaDrop = b.present ? (100 * (a.area - b.area)) / a.area : 100;
    const durInc = b.present ? (100 * (b.duration - a.duration)) / a.duration : null;
    const seg = `${L(STIM_SITES[rows[i - 1].key])}→${L(STIM_SITES[rows[i].key])}`;
    if (motor) {
      if (areaDrop > 50) interp.push(L(`<b>${seg}：面积下降 ${fmt(areaDrop, 0)}% (&gt;50%)</b> —— 符合电生理传导阻滞（p.38，基于计算机模拟的标准）。`, `<b>${seg}: area drop ${fmt(areaDrop, 0)}% (&gt;50%)</b> — meets electrophysiologic conduction block (p.38, simulation-based criterion).`));
      else if (ampDrop > 20 || areaDrop > 20) interp.push(L(`${seg}：波幅下降 ${fmt(ampDrop, 0)}%、面积下降 ${fmt(areaDrop, 0)}%。正常人通常 ≤20%（p.37），但仅凭离散与相位抵消面积即可下降达 50%（p.38）——不能单凭波幅下降判定阻滞。`, `${seg}: amplitude −${fmt(ampDrop, 0)}%, area −${fmt(areaDrop, 0)}%. Normal subjects usually ≤20% (p.37), yet dispersion and phase cancellation alone can reduce area by up to 50% (p.38) — amplitude drop alone does not prove block.`));
      if (durInc !== null && durInc > 15) interp.push(L(`${seg}：时程增加 ${fmt(durInc, 0)}% (&gt;15%) —— 异常时间离散（p.37）。`, `${seg}: duration +${fmt(durInc, 0)}% (&gt;15%) — abnormal temporal dispersion (p.37).`));
    }
  }
  const nAmp = d0.mNm.amp;
  const aAmp = d0.mAb.present ? d0.mAb.amp : 0;
  if (aAmp < 0.7 * nAmp && !(Number.isFinite(minCV) && minCV < 35)) {
    interp.push(L('远端波幅降低而传导速度/潜伏期相对保留：与轴突丢失相符，但并不特异——远端以下的阻滞、神经肌肉接头病（突触前）或严重/远端肌病也可降低 CMAP（p.24, p.34）。', 'Low distal amplitude with relatively preserved CV/latency: consistent with axonal loss but not specific — block distal to the stimulation site, presynaptic NMJ disease or severe/distal myopathy also lower the CMAP (p.24, p.34).'));
  }
  if (p.axonal.on && p.day < 5 && p.axonal.site !== 'distal') interp.push(L('<b>超急性期</b>：远端刺激正常而跨病灶刺激下降 = “假性传导阻滞”。约 1 周后复查（沃勒变性完成）才能与真性脱髓鞘阻滞区分（p.35, p.263）。', '<b>Hyperacute</b>: normal distal response with a drop across the lesion = “pseudo-conduction block”. Repeat after ~1 week (Wallerian degeneration complete) to separate it from true demyelinating block (p.35, p.263).'));
  if (p.axonal.on && p.axonal.site === 'rootPre' && !motor && p.axonal.population !== 'motor') {
    interp.push(L('<b>SNAP 正常，尽管 80% 级别的感觉根纤维被离断</b>：病灶位于 DRG 近端（节前），周围感觉突起与其胞体仍相连而不变性。患者可有感觉缺失而 SNAP 正常——提示节前病变（根、脊髓）（p.28–29）。', '<b>Normal SNAP despite transected sensory root fibres</b>: the lesion is proximal to the DRG (preganglionic), so peripheral sensory processes remain attached to their cell bodies and do not degenerate. Sensory loss with a normal SNAP suggests a preganglionic lesion (root, cord) (p.28–29).').replace('80% 级别的', ''));
  }
  if (p.axonal.on && p.axonal.site === 'plexus' && !motor && p.axonal.population !== 'motor' && p.day >= 10) {
    interp.push(L('SNAP 降低：病灶位于 DRG 或其远端（节后，如神经丛），感觉轴突远端发生沃勒变性——这是与神经根病鉴别的关键（p.584）。', 'Low SNAP: the lesion is at or distal to the DRG (postganglionic, e.g. plexus), so sensory axons degenerate distally — the key difference from radiculopathy (p.584).'));
  }
  if (!interp.length) interp.push(L('各项测量与该受试者的正常值一致。临床判断需与年龄/身高/温度匹配的实验室正常值比较。', 'Measurements match this subject’s normal values. Clinical judgement requires age/height/temperature-matched laboratory reference values.'));
  // measures table
  const cols = [L('正常', 'Normal'), L('当前', 'Current'), 'Δ%'];
  const mrows = [];
  rows.forEach((row) => {
    const a = row.mAb;
    const n = row.mNm;
    const site = L(STIM_SITES[row.key]);
    const sc = motor ? 1 : 1000;
    const u = motor ? 'mV' : 'µV';
    mrows.push({ label: `${site} · ${L('起始潜伏期', 'onset latency')}`, unit: 'ms', vals: [n.onset, a.present ? a.onset : null, a.present ? pctChange(n.onset, a.onset) : null], digits: 2 });
    mrows.push({ label: `${site} · ${L('波幅（基线-负峰）', 'amplitude (base–neg peak)')}`, unit: u, vals: [n.amp * sc, a.amp * sc, pctChange(n.amp, a.amp)], digits: motor ? 2 : 0, hl: true });
    mrows.push({ label: `${site} · ${L('负相时程', 'neg. duration')}`, unit: 'ms', vals: [n.duration, a.present ? a.duration : null, a.present ? pctChange(n.duration, a.duration) : null], digits: 2 });
    mrows.push({ label: `${site} · ${L('负相面积', 'neg. area')}`, unit: `${u}·ms`, vals: [n.area * sc, a.area * sc, pctChange(n.area, a.area)], digits: motor ? 1 : 0 });
  });
  r.segs.forEach((s) => {
    mrows.push({
      label: `CV ${L(STIM_SITES[s.from])}–${L(STIM_SITES[s.to])} (${s.dist} mm)`,
      unit: 'm/s',
      vals: [s.cvNm, s.cvAb, s.cvAb ? pctChange(s.cvNm, s.cvAb) : null],
      digits: 1,
      flag: ['', s.cvAb !== null && s.cvAb < 35 ? 'bad' : '', ''],
    });
  });
  if (r.sensCV) mrows.push({ label: L(`感觉 CV（距离/起始潜伏期，${r.sensCV.dist} mm）`, `Sensory CV (distance/onset, ${r.sensCV.dist} mm)`), unit: 'm/s', vals: [r.sensCV.nm, r.sensCV.ab, r.sensCV.ab ? pctChange(r.sensCV.nm, r.sensCV.ab) : null], digits: 1, flag: ['', r.sensCV.ab !== null && r.sensCV.ab < 35 ? 'bad' : '', ''] });
  for (let i = 1; i < rows.length; i++) {
    const a = rows[i - 1].mAb;
    const b = rows[i].mAb;
    const lab = `${L(STIM_SITES[rows[i - 1].key])}→${L(STIM_SITES[rows[i].key])}`;
    const nA = rows[i - 1].mNm;
    const nB = rows[i].mNm;
    const drop = (x, y) => (x && x.present ? (100 * (x.amp - (y.present ? y.amp : 0))) / x.amp : null);
    const adrop = (x, y) => (x && x.present ? (100 * (x.area - (y.present ? y.area : 0))) / x.area : null);
    const ad = adrop(a, b);
    mrows.push({ label: `${lab} ${L('波幅下降', 'amplitude drop')}`, unit: '%', vals: [drop(nA, nB), drop(a, b), ''], digits: 0, flag: ['', motor && drop(a, b) > 20 ? 'warn' : '', ''] });
    mrows.push({ label: `${lab} ${L('面积下降', 'area drop')}`, unit: '%', vals: [adrop(nA, nB), ad, ''], digits: 0, flag: ['', motor && ad > 50 ? 'bad' : motor && ad > 20 ? 'warn' : '', ''] });
    mrows.push({ label: `${lab} ${L('时程增加', 'duration increase')}`, unit: '%', vals: [pctChange(nA.duration, nB.duration), a.present && b.present ? pctChange(a.duration, b.duration) : null, ''], digits: 0, flag: ['', motor && a.present && b.present && pctChange(a.duration, b.duration) > 15 ? 'warn' : '', ''] });
  }
  const measures = {
    cols,
    rows: mrows,
    note: L(
      `测量约定（p.24–27）：潜伏期至首个偏离基线点${motor ? '' : '（三相 SNAP 取起始正峰）'}；波幅 = 基线至负峰；时程 = 负相时程；面积 = 负相面积。运动 CV = 距离 ÷（近端潜伏期 − 远端潜伏期），因为远端潜伏期还包含 NMJ 传递与肌纤维去极化时间（p.25）。彩色阈值标记仅采用教科书给出的标准；“正常”列是同一模拟受试者，而非实验室正常值。`,
      `Conventions (p.24–27): latency to first departure from baseline${motor ? '' : ' (initial positive peak for a triphasic SNAP)'}; amplitude = baseline to negative peak; duration = negative-peak duration; area = negative-peak area. Motor CV = distance ÷ (proximal − distal latency) because distal latency also contains NMJ and muscle depolarisation time (p.25). Coloured flags use only textbook-stated criteria; the “Normal” column is the same simulated subject, not a laboratory reference range.`
    ),
  };
  return {
    chain: [lesionText(p), physText(p), srcTxt, wf, interp.join('<br>')],
    measures,
    caveat: caveat(p),
    sources: L('来源：Preston & Shapiro 第4版 第2–3章（p.13–40），第16章（p.260–266），第29章 p.503。', 'Sources: Preston & Shapiro 4th ed., Ch 2–3 (p.13–40), Ch 16 (p.260–266), Ch 29 p.503.'),
  };
}

function caveat(p) {
  if (p.demyel.on && p.demyel.mechanism === 'nodal') return L('<p>传导失败（阻滞）常被视为获得性脱髓鞘的标志，但结区/旁结区功能障碍（如部分多灶性运动神经病）也可产生阻滞，且改善速度可能快于再髓鞘化所需时间（p.503）。</p>', '<p>Conduction failure is usually taken as a marker of acquired demyelination, but nodal/paranodal dysfunction (e.g. some multifocal motor neuropathy) can also produce block, and may recover faster than remyelination would allow (p.503).</p>');
  if (p.demyel.on) return L('<p>近端波幅下降不等于传导阻滞：离散与相位抵消可单独使 CMAP 面积下降达 50%（p.38）；还须排除近端刺激不足、刺激扩散、Martin-Gruber 吻合（p.67），胫神经腘窝刺激正常人也可下降达 50%（p.37）。</p>', '<p>A proximal amplitude drop is not automatically conduction block: dispersion and phase cancellation alone can cut CMAP area by up to 50% (p.38). Also exclude submaximal proximal stimulation, current spread, Martin-Gruber anastomosis (p.67); tibial popliteal stimulation can drop up to 50% in normals (p.37).</p>');
  if (p.axonal.on) return L('<p>波幅降低并非轴突丢失所特有：远端刺激点与记录电极之间的阻滞、突触前 NMJ 病、严重肌病同样可降低波幅（p.24, p.36–37）。急性损伤数天内远端检查可完全正常（p.34）。</p>', '<p>Low amplitude is not unique to axonal loss: block between the distal stimulation site and the muscle, presynaptic NMJ disease, or severe myopathy also lower it (p.24, p.36–37). Within the first days after injury the distal study can be entirely normal (p.34).</p>');
  if (p.myopathy.on) return L('<p>多数肌病 NCS 正常；只有远端受累或严重全身性肌病才降低 CMAP，而潜伏期与 CV 保持正常（p.38, p.266）。</p>', '<p>Most myopathies have normal NCS; only distal or severe generalised myopathy lowers the CMAP, while latency and CV stay normal (p.38, p.266).</p>');
  return L('<p>正常情况下，近端 SNAP 的波幅与面积明显小于远端，这是生理性的时间离散与相位抵消，运动纤维受影响小得多（p.30–32, Fig 3.11–3.12）。</p>', '<p>Normally, proximal SNAPs are much smaller in amplitude and area than distal ones — physiological dispersion and phase cancellation, which affect motor responses far less (p.30–32, Fig 3.11–3.12).</p>');
}

const WHY = {
  'axonal.frac': {
    zh: '改变了离断轴突的比例。每根被离断（且已沃勒变性）的轴突带走其运动单位的全部肌纤维电位（或其感觉纤维电位），因此波幅与面积大致按比例下降；只要最快纤维仍存活，潜伏期与 CV 几乎不变（p.34）。',
    en: 'You changed the fraction of transected axons. Each transected (and degenerated) axon removes all of its unit’s fibre potentials (or its sensory fibre potential), so amplitude and area fall roughly in proportion; latency and CV barely change as long as the fastest fibres survive (p.34).',
  },
  'axonal.selection': {
    zh: '改变了“哪些轴突丢失”。潜伏期与 CV 只反映最快的纤维（p.25）：若最快纤维优先丢失，CV 会轻度下降、潜伏期轻度延长，但不会低于约 75% LLN（p.34）。',
    en: 'You changed which axons are lost. Latency and CV reflect only the fastest fibres (p.25): losing the fastest first slows CV slightly and prolongs latency slightly, but not below ≈75% of LLN (p.34).',

    zh: '改变了距损伤的时间。沃勒变性前，病灶远端的轴突仍可被刺激；之后远端残端失去兴奋性，所有刺激部位的反应都下降（运动 3–5 天、感觉 6–10 天，p.35）。',
    en: 'You changed the time since injury. Before Wallerian degeneration the distal stump is still excitable; afterwards it is not, and responses fall at every site (motor 3–5 d, sensory 6–10 d, p.35).',

  if (!phys.length) phys.push(L('每个运动单位：一个前角细胞、一根轴突和散布在 5–10 mm 区域内的肌纤维（p.245）。', 'Each motor unit: one anterior horn cell, one axon and fibres scattered over a 5–10 mm territory (p.245).'));
  const src = [];
  src.push(L(`针尖附近：MU ${r.focus ?? '—'} 在 1 mm 内有 ${nNear} 根纤维（正常 ${nNearN}）${nReinn ? `，其中 ${nReinn} 根为再支配纤维` : ''}。可辨单位（≥0.5 mV）：${r.dA.length}（正常 ${r.dN.length}）。`, `Near the tip: MU ${r.focus ?? '—'} has ${nNear} fibres within 1 mm (normal ${nNearN})${nReinn ? `, ${nReinn} of them reinnervated` : ''}. Discernible units (≥0.5 mV): ${r.dA.length} (normal ${r.dN.length}).`));
  if (rest) src.push(L(`静息时针尖附近每秒约 ${spontNear} 次单纤维自发放电。`, `At rest ≈${spontNear} single-fibre spontaneous discharges per second near the tip.`));
  else src.push(L(`神经驱动 ${fmt((100 * r.eA.drive) / DMAX, 0)}%（正常 ${fmt((100 * r.eN.drive) / DMAX, 0)}%）→ 全肌募集 ${r.stA.nActive} 个单位（正常 ${r.stN.nActive}）→ 力 ${fmt(r.stA.forcePct, 0)}%（正常 ${fmt(r.stN.forcePct, 0)}%）。`, `Neural drive ${fmt((100 * r.eA.drive) / DMAX, 0)}% (normal ${fmt((100 * r.eN.drive) / DMAX, 0)}%) → ${r.stA.nActive} units recruited in the muscle (normal ${r.stN.nActive}) → force ${fmt(r.stA.forcePct, 0)}% (normal ${fmt(r.stN.forcePct, 0)}%).`));
  const wf = [];
  if (qA && qA.present) wf.push(L(`聚焦 MUAP：${fmt(qA.p2p * 1000, 0)} µV、${fmt(qA.duration, 1)} ms、${qA.phases} 相${qN && qN.present ? `（同一单位正常时 ${fmt(qN.p2p * 1000, 0)} µV、${fmt(qN.duration, 1)} ms、${qN.phases} 相）` : ''}。`, `Focus MUAP: ${fmt(qA.p2p * 1000, 0)} µV, ${fmt(qA.duration, 1)} ms, ${qA.phases} phases${qN && qN.present ? ` (same unit when normal: ${fmt(qN.p2p * 1000, 0)} µV, ${fmt(qN.duration, 1)} ms, ${qN.phases} phases)` : ''}.`));
  wf.push(L(`多部位取样（${r.sA.n} 个 MUAP）：平均时程 ${fmt(r.sA.dur, 1)} ms（正常 ${fmt(r.sN.dur, 1)}），平均波幅 ${fmt(r.sA.amp * 1000, 0)} µV（正常 ${fmt(r.sN.amp * 1000, 0)}），多相 ${fmt(r.sA.poly, 0)}%（正常 ${fmt(r.sN.poly, 0)}%）。`, `Survey (${r.sA.n} MUAPs): mean duration ${fmt(r.sA.dur, 1)} ms (normal ${fmt(r.sN.dur, 1)}), mean amplitude ${fmt(r.sA.amp * 1000, 0)} µV (normal ${fmt(r.sN.amp * 1000, 0)}), polyphasic ${fmt(r.sA.poly, 0)}% (normal ${fmt(r.sN.poly, 0)}%).`));
  if (!rest) wf.push(L(`募集：针尖处 ${r.firingA.length} 个可辨单位在放电，最快 ${fmt(r.rateA, 0)} Hz（正常 ${r.firingN.length} 个，最快 ${fmt(r.rateN, 0)} Hz）。`, `Recruitment: ${r.firingA.length} discernible units firing at the tip, fastest ${fmt(r.rateA, 0)} Hz (normal ${r.firingN.length}, fastest ${fmt(r.rateN, 0)} Hz).`));
  return {
    chain: [lesionText(p), phys.join(' '), src.join('<br>'), wf.join('<br>'), interpret(r, p)],
    measures: measures(r, p),
    caveat: caveat(p),
    sources: L('来源：第12、14、15、16章（p.135–137, 231–268）。', 'Sources: Ch 12, 14, 15, 16 (p.135–137, 231–268).'),
  };
}

function ratio(rate, n) {
  return n ? rate / n : null;
}

function interpret(r, p) {
  const out = [];
  const rest = p.activity === 'rest' || p.activity === 'insertion';
  const ra = ratio(r.rateA, r.firingA.length);
  if (rest) {
    if (r.rest.events.some((e) => e.kind === 'fib' || e.kind === 'psw')) out.push(L('静息时可见纤颤电位/正锐波：单根肌纤维的自发放电，提示“活动性失神经”，但也见于部分肌病（炎性、坏死性、肌营养不良）及重度 NMJ 病（肉毒中毒）（p.234）。', 'Fibrillations/PSWs at rest: spontaneous single-fibre discharges indicating active denervation — but also seen in some myopathies (inflammatory, necrotising, dystrophies) and severe NMJ disease (botulism) (p.234).'));
    else if (p.axonal.on && p.day < 10) out.push(L('静息电静息：失神经电位尚未出现——出现时间取决于病灶到肌肉的神经长度（p.236）。早期检查正常并不排除轴突损伤。', 'Electrically silent at rest: denervation potentials have not yet appeared — onset depends on nerve length between lesion and muscle (p.236). An early normal study does not exclude axonal injury.'));
    else out.push(L('静息无自发电位。插入活动正常应 ≤300 ms（p.137）。', 'No spontaneous activity at rest. Normal insertional activity lasts ≤300 ms (p.137).'));
    return out.join('<br>');
  }
  if (ra !== null) {
    if (ra > 7.5 && (p.axonal.on || p.block > 0)) out.push(L(`<b>募集减少</b>：最快单位 ${fmt(r.rateA, 0)} Hz 而针尖处只有 ${r.firingA.length} 个单位（比值 ≈${fmt(ra, 0)}:1，正常约 5:1，p.253）。剩余单位只能靠更快放电来产生力。`, `<b>Reduced recruitment</b>: fastest unit ${fmt(r.rateA, 0)} Hz with only ${r.firingA.length} units at the tip (ratio ≈${fmt(ra, 0)}:1 vs ≈5:1 normally, p.253). The remaining units must fire faster to make force.`));
    if ((p.centralCap ?? 1) < 1 && r.rateA < 0.8 * r.rateN) out.push(L(`<b>激活减少</b>：放电频率最高只有 ${fmt(r.rateA, 0)} Hz，但单位数与频率之比仍正常——干扰相稀疏并不等于周围运动单位丢失（p.253–254）。`, `<b>Reduced activation</b>: firing rates rise only to ${fmt(r.rateA, 0)} Hz, but the number of units remains appropriate for that rate — a sparse interference pattern does not by itself mean peripheral unit loss (p.253–254).`));
  }
  if (p.myopathy.on) {
    if (p.effortMode === 'force' && r.stA.nActive > r.stN.nActive) out.push(L(`<b>早期募集</b>：为达到同样的 ${p.targetForce}% 力，需要募集 ${r.stA.nActive} 个单位（正常 ${r.stN.nActive}），因为每个单位的力变小（p.254, p.256–257）。`, `<b>Early recruitment</b>: reaching the same ${p.targetForce}% force needs ${r.stA.nActive} units (normal ${r.stN.nActive}) because each unit makes less force (p.254, p.256–257).`));
    if (p.effortMode === 'drive') out.push(L(`相同神经驱动下，单位数与频率与正常相同，但只产生 ${fmt(r.stA.forcePct, 0)}% 的力（正常 ${fmt(r.stN.forcePct, 0)}%）——“早期募集”是相对于力而言的（p.254）。`, `With the same drive, the same units fire at the same rates, but produce only ${fmt(r.stA.forcePct, 0)}% force (normal ${fmt(r.stN.forcePct, 0)}%) — “early recruitment” is relative to force (p.254).`));
    out.push(L('短时程、低波幅、多相 MUAP + 正常或早期募集 = 典型肌病模式（p.256–257）。', 'Short, small, polyphasic MUAPs with normal or early recruitment = the classic myopathic pattern (p.256–257).'));
  }
  if (p.axonal.on) {
    if (r.sA.dur > 1.1 * r.sN.dur && r.sA.amp > 1.1 * r.sN.amp) out.push(L('长时程、高波幅（多相）MUAP + 募集减少 = 慢性神经源性（再支配）模式；至少需数周、通常数月形成（p.256）。', 'Long-duration, high-amplitude (polyphasic) MUAPs with reduced recruitment = chronic neurogenic (reinnervation) pattern; takes at least weeks and usually months (p.256).'));
    else if (p.day < 21) out.push(L('急性期：MUAP 形态仍正常，唯一异常为募集减少（p.255）。', 'Acute: MUAP morphology still normal; reduced recruitment is the only abnormality (p.255).'));
    if (p.reinnervation < 0.2 && p.day > 90) out.push(L('再支配很少：若只靠轴突再生，早期的“新生单位”短小多相，却伴明显募集减少——不要误认为肌病（p.257）。', 'Little collateral reinnervation: early regenerated “nascent” units are small and polyphasic but with markedly reduced recruitment — do not mistake them for myopathy (p.257).'));
  }
  if (p.block > 0 && !p.axonal.on) out.push(L('单纯脱髓鞘传导阻滞：募集减少而 MUAP 形态正常、无纤颤（p.256, p.262）。', 'Pure demyelinating block: reduced recruitment with normal MUAP morphology and no fibrillations (p.256, p.262).'));
  if (!out.length) out.push(L('MUAP 形态与募集与正常一致。', 'MUAP morphology and recruitment match normal.'));
  return out.join('<br>');
}

function measures(r, p) {
  const qA = r.focus !== null ? r.qA.get(r.focus) : null;
  const qN = r.focus !== null && r.qN.has(r.focus) ? r.qN.get(r.focus) : null;
  const rows = [
    { label: L('神经驱动', 'Neural drive'), unit: '%', vals: [(100 * r.eN.drive) / DMAX, (100 * r.eA.drive) / DMAX], digits: 0 },
    { label: L('产生的力', 'Force produced'), unit: '%', vals: [r.stN.forcePct, r.stA.forcePct], digits: 0, hl: p.effortMode === 'drive' },
    { label: L('全肌募集的单位', 'Units recruited (muscle)'), vals: [r.stN.nActive, r.stA.nActive], digits: 0, hl: p.effortMode === 'force' },
    { label: L('针尖处放电的可辨单位', 'Discernible units firing at tip'), vals: [r.firingN.length, r.firingA.length], digits: 0 },
    { label: L('最快单位放电频率', 'Fastest unit firing rate'), unit: 'Hz', vals: [r.rateN, r.rateA], digits: 0 },
    { label: L('频率 : 单位数', 'Rate : units'), vals: [ratio(r.rateN, r.firingN.length), ratio(r.rateA, r.firingA.length)], digits: 1, flag: ['', ratio(r.rateA, r.firingA.length) > 7.5 ? 'warn' : ''] },
    { label: L('聚焦 MUAP 波幅', 'Focus MUAP amplitude'), unit: 'µV', vals: [qN && qN.present ? qN.p2p * 1000 : null, qA && qA.present ? qA.p2p * 1000 : null], digits: 0 },
    { label: L('聚焦 MUAP 时程', 'Focus MUAP duration'), unit: 'ms', vals: [qN && qN.present ? qN.duration : null, qA && qA.present ? qA.duration : null], digits: 1 },
    { label: L('聚焦 MUAP 相数', 'Focus MUAP phases'), vals: [qN && qN.present ? qN.phases : null, qA && qA.present ? qA.phases : null], digits: 0 },
    { label: L('取样平均时程', 'Survey mean duration'), unit: 'ms', vals: [r.sN.dur, r.sA.dur], digits: 1, hl: true },
    { label: L('取样平均波幅', 'Survey mean amplitude'), unit: 'µV', vals: [r.sN.amp * 1000, r.sA.amp * 1000], digits: 0 },
    { label: L('多相 MUAP 比例', 'Polyphasic MUAPs'), unit: '%', vals: [r.sN.poly, r.sA.poly], digits: 0 },
    { label: L('自发放电的肌纤维（全肌）', 'Spontaneously firing fibres (muscle)'), vals: [0, r.fibrillating], digits: 0, flag: ['', r.fibrillating ? 'bad' : ''] },
  ];
  return {
    cols: [L('正常', 'Normal'), L('当前', 'Current')],
    rows,
    note: L('“可辨单位”= 正常肌肉在此针位峰-峰值 ≥0.5 mV 的 MUAP（模型标定 5:1 规则所用的定义）；病理肌肉中追踪同一批单位（仍 ≥0.1 mV 且可被随意激活者），再加上新变为 ≥0.5 mV 的单位（如再支配后变大）。'+'MUAP 时程阈值窗 ±15 µV（算法参数，非临床标准）。正常值随肌肉与年龄而异（p.247 表15.1），此处“正常”为同一模拟受试者。', '“Discernible” = MUAPs ≥0.5 mV peak-to-peak at this needle position in the normal muscle (the definition used to calibrate the 5:1 rule); in the abnormal muscle the same units are followed (if still ≥0.1 mV and voluntarily available), plus any unit that has newly become ≥0.5 mV (e.g. enlarged by reinnervation).'+' MUAP duration window ±15 µV (algorithm parameter, not a clinical criterion). Normal values depend on muscle and age (p.247, Table 15.1); “normal” here is the same simulated subject.'),
  };
}

function caveat(p) {
  if (p.myopathy.on) return L('<p>晚期或特殊肌病可偏离典型模式：慢性肌病可同时出现长大 MUAP（伴去神经/再支配）；终末期肌病可募集减少；类固醇肌病及部分代谢/线粒体肌病 EMG 可正常——EMG 正常不能排除所有肌病（p.257, p.267, p.678）。</p>', '<p>Advanced or specific myopathies can deviate from the classic pattern: chronic myopathies may also show long, large MUAPs (denervation/reinnervation); end-stage myopathy can reduce recruitment; steroid and some metabolic/mitochondrial myopathies may have a normal EMG — a normal EMG does not exclude all myopathies (p.257, p.267, p.678).</p>');
  if (p.axonal.on) return L('<p>多相性本身无特异性：既见于早期再支配，也见于肌病（p.248）。短小多相 MUAP 也可能是重度失神经后的“新生单位”——要看募集（p.257）。失神经电位的出现时间取决于病灶到肌肉的长度，而非固定天数（p.236）。</p>', '<p>Polyphasia alone is nonspecific: it occurs in early reinnervation and in myopathy (p.248). Small polyphasic MUAPs can also be “nascent” units after severe denervation — look at recruitment (p.257). Denervation potentials appear after a length-dependent delay, not a fixed number of days (p.236).</p>');
  if ((p.centralCap ?? 1) < 1) return L('<p>疼痛、配合差、功能性无力或中枢病变都可导致激活减少；同一肌肉也可同时存在募集减少与激活减少（如肌萎缩侧索硬化，或伴疼痛的神经根病，p.254）。</p>', '<p>Pain, poor cooperation, functional weakness or CNS lesions all reduce activation; reduced recruitment and reduced activation can coexist in one muscle (e.g. ALS, or radiculopathy with pain, p.254).</p>');
  return L('<p>MUAP 波幅主要来自离针尖最近的少数（2–12 根）纤维，对针位极敏感；时程反映更多纤维，受针位影响较小（p.249–251）。判断须基于多个 MUAP 的平均（约 20 个，p.246）。</p>', '<p>MUAP amplitude comes mainly from the few (2–12) fibres nearest the tip and is very sensitive to needle position; duration reflects more fibres and is less position-dependent (p.249–251). Judgements need the mean of many MUAPs (≈20, p.246).</p>');
}

const WHY = {
  'axonal.frac': { zh: '改变了丢失的运动轴突比例：可被驱动的单位变少 → 为了产生同样的力，剩余单位必须更快放电（募集减少）；被孤立的肌纤维随后去神经并可被侧支再支配。', en: 'You changed the fraction of motor axons lost: fewer units can be driven → the survivors must fire faster for the same force (reduced recruitment); orphaned fibres later denervate and may be reinnervated.' },
  day: { zh: '改变了距损伤时间：病程（天–月）与波形时间轴（毫秒）是分开的。急性期只有募集减少；数周后出现纤颤；数月后再支配使 MUAP 变大变长。', en: 'You changed the time since injury: the disease clock (days–months) is separate from the waveform clock (ms). Acutely only recruitment is reduced; fibrillations appear after weeks; months later reinnervation enlarges and prolongs MUAPs.' },
  reinnervation: { zh: '改变了侧支再支配程度：更多孤立纤维被存活单位接管 → 这些单位的纤维数、分布区、时程与波幅增加，但单位“数目”不会恢复（募集仍减少）。', en: 'You changed the reinnervation extent: more orphaned fibres join surviving units → their fibre count, territory, duration and amplitude increase, but the NUMBER of units does not recover (recruitment stays reduced).' },
  'myopathy.fiberLoss': { zh: '改变了单位内肌纤维丢失：MUAP 中靠近针尖的纤维更少 → 波幅、时程下降，剩余纤维不同步 → 多相；每个单位的力变小 → 同样的力需要更多单位。', en: 'You changed fibre loss within units: fewer fibres near the tip → lower amplitude and shorter duration; asynchronous remaining fibres → polyphasia; each unit makes less force → more units are needed for the same force.' },
  'myopathy.sizeVar': { zh: '改变了纤维大小变异：纤维传导速度与电位大小不一 → 到达针尖的时间更分散 → 更多相位/转折。', en: 'You changed fibre-size variability: unequal fibre velocities and potentials → arrivals at the tip are more dispersed → more phases/turns.' },
  centralCap: { zh: '改变了可达到的中枢驱动：周围单位不变，但放电频率与募集都停在较低水平；单位数与频率之比仍正常。', en: 'You changed achievable central drive: peripheral units are unchanged, but firing rates and recruitment stop at a lower level; the units-to-rate relationship stays normal.' },
  block: { zh: '改变了传导阻滞：被阻滞的单位不能被随意激活（募集减少），但其肌纤维仍有神经支配，不出现纤颤，MUAP 形态不变。', en: 'You changed conduction block: blocked units cannot be activated voluntarily (reduced recruitment), but their fibres stay innervated — no fibrillations, unchanged MUAP morphology.' },
  needle: { zh: '移动了针尖：病理完全没变，只是采样到的纤维不同。波幅变化最大（取决于最近的少数纤维），时程变化较小。', en: 'You moved the needle: the pathology is unchanged; only the sampled fibres differ. Amplitude changes most (it depends on the nearest few fibres); duration changes less.' },
  anatomy: { zh: '移动了针尖：病理完全没变，只是采样到的纤维不同。波幅变化最大（取决于最近的少数纤维），时程变化较小（p.250–251, Fig 15.10）。', en: 'You moved the needle: the pathology is unchanged; only the sampled fibres differ. Amplitude changes most (nearest few fibres), duration less (p.250–251, Fig 15.10).' },
  'needle.z': { zh: '改变了针尖与终板带的距离：动作电位需传播更远才到达针尖，纤维间速度差导致到达更分散。在终板带内还会记录到终板电位。', en: 'You changed the distance from the endplate band: APs travel farther to the tip and fibre velocity differences spread their arrival.' },
  targetForce: { zh: '改变了目标力：先通过提高已放电单位的频率（频率编码），再募集更高阈值的单位（大小原则，p.246, p.251–253）。', en: 'You changed the target force: force rises first by faster firing (rate coding), then by recruiting higher-threshold units (size principle, p.246, p.251–253).' },
  drive: { zh: '改变了神经驱动：驱动越大，已募集单位放电越快，阈值更高的单位依次加入。', en: 'You changed neural drive: more drive → recruited units fire faster and higher-threshold units join in order.' },
  effortMode: { zh: '切换了比较条件：相同力（看需要多少单位）与相同驱动（看产生多少力）回答的是不同问题。', en: 'You switched the matched condition: same force (how many units are needed) and same drive (how much force results) answer different questions.' },
  activity: { zh: '切换了状态：静息看自发电位，插入看插入电位，收缩看 MUAP 与募集。', en: 'You switched state: rest shows spontaneous activity, insertion shows insertional activity, contraction shows MUAPs and recruitment.' },
};

function why(prev, cur) {
  const k = prev.changed;
  const a = prev.result;
  const b = cur.result;
  let h = `<p>${WHY[k] ? L(WHY[k]) : L(`改变了“${k}”。`, `You changed “${k}”.`)}</p>`;
  if (a && b && a.sA) {
    h += '<ul>';
    h += `<li>${L('取样平均时程', 'Survey mean duration')}: ${fmt(a.sA.dur, 1)} → <b>${fmt(b.sA.dur, 1)}</b> ms; ${L('波幅', 'amplitude')} ${fmt(a.sA.amp * 1000, 0)} → <b>${fmt(b.sA.amp * 1000, 0)}</b> µV; ${L('多相', 'polyphasic')} ${fmt(a.sA.poly, 0)} → <b>${fmt(b.sA.poly, 0)}</b>%</li>`;
    h += `<li>${L('募集单位（全肌）', 'Units recruited (muscle)')}: ${a.stA.nActive} → <b>${b.stA.nActive}</b>; ${L('力', 'force')} ${fmt(a.stA.forcePct, 0)} → <b>${fmt(b.stA.forcePct, 0)}</b>%; ${L('最快频率', 'fastest rate')} ${fmt(a.rateA, 0)} → <b>${fmt(b.rateA, 0)}</b> Hz</li>`;
    h += `<li>${L('自发放电纤维', 'Spontaneously firing fibres')}: ${a.fibrillating} → <b>${b.fibrillating}</b></li>`;
    h += '</ul>';
  }
  return h;
}

const base = () => JSON.parse(JSON.stringify(DEFAULT_PARAMS));
function comparePresets() {
  const mk = (key, label, f) => ({
    key,
    label,
    params: (cur) => {
      const p = { ...JSON.parse(JSON.stringify(cur)), ...base(), block: 0, irritabilityOnly: false };
      p.axonal = { ...base().axonal, population: 'motor', frac: 0.6 };
      return { ...p, ...f(p) };
    },
  });
  return [

function explain(r, c) {

  if (c.type === 'crd') rows.push({ label: L('复合波内抖动', 'Within-complex jitter'), unit: 'µs', vals: [m.jitter], digits: 1 });
  const notes = [];
  if (voluntaryImpossible) notes.push(L('频率 <4–5 Hz：不可能是随意放电（p.232）。', 'Rate <4–5 Hz: cannot be voluntary (p.232).'));
  if ((c.type === 'fib' || c.type === 'psw') && m.p2p < 10) notes.push(L('&lt;10 µV 的“微小纤颤”提示慢性（&gt;6–12 个月）失神经（p.234）。', '&lt;10 µV “tiny” fibrillations suggest chronic (&gt;6–12 months) denervation (p.234).'));

  return {
    chain: chain(r),
    measures: {
      cols: [L('测量值', 'Measured')],

    sources: L('来源：p.230–240，表 14.1，Box 14.1。', 'Sources: p.230–240, Table 14.1, Box 14.1.'),

  txt(ctx, L('刺激序号', 'stimulus number'), (x0 + x1) / 2, h - 8, th.muted, 'center', 10);
}

function drawSafetyClasses(ctx, w, h, r, k, lang) {
  const th = theme();
  const st = r.trains[0].res[k];
  const classes = gainClasses();
  const x0 = 54;
  const x1 = w - 16;
  const y0 = 30;
  const y1 = h - 34;
  axes(ctx, x0, y0, x1, y1, th);
  const maxE = 60;
  const yOf = (v) => y1 - ((y1 - y0) * Math.min(maxE, v)) / maxE;
  for (const g of [0, 15, 30, 45, 60]) txt(ctx, `${g}`, x0 - 6, yOf(g) + 4, th.muted, 'right', 10);
  const bw = (x1 - x0) / classes.length;
  classes.forEach((g, i) => {
    const e = st.epp * g;
    const f = st.fire[i];
    ctx.fillStyle = f > 0.5 ? withAlpha(th.good, 0.65) : withAlpha(th.bad, 0.7);
    ctx.fillRect(x0 + i * bw + 1, yOf(e), bw - 2, y1 - yOf(e));
  });
  ctx.strokeStyle = th.ink;
  ctx.setLineDash([5, 3]);
  ctx.beginPath();
  ctx.moveTo(x0, yOf(PV.eppThresholdMv));
  ctx.lineTo(x1, yOf(PV.eppThresholdMv));
  ctx.stroke();
  ctx.setLineDash([]);
  txt(ctx, L(`阈值 ${PV.eppThresholdMv} mV`, `threshold ${PV.eppThresholdMv} mV`), x1, yOf(PV.eppThresholdMv) - 4, th.ink, 'right', 10, 600);
  txt(ctx, L(`第 ${k + 1} 次刺激：各组纤维的 EPP（mV）；${Math.round(st.frac * 100)}% 纤维兴奋`, `Stimulus #${k + 1}: EPP per fibre group (mV); ${Math.round(st.frac * 100)}% of fibres fire`), x0, 18, th.muted, 'left', 10.5, 600);
  txt(ctx, L('← 安全系数低  ·  高 →', '← low safety factor  ·  high →'), (x0 + x1) / 2, h - 12, th.muted, 'center', 10);
}

function drawEppToThreshold(ctx, w, h, r, lang) {
  const th = theme();
  const x0 = 54;
  const x1 = w - 16;
  const y0 = 26;
  const y1 = h - 38;
  axes(ctx, x0, y0, x1, y1, th);
  const eMax = 45;
  const tMax = 1.2;
  const xOf = (e) => x0 + ((x1 - x0) * e) / eMax;
  const yOf = (t) => y1 - ((y1 - y0) * Math.min(tMax, t)) / tMax;
  const thr = PV.eppThresholdMv;
  // time-to-threshold curve
  ctx.strokeStyle = th.ink;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  let first = true;
  for (let e = thr + 0.05; e <= eMax; e += 0.1) {
    const t = -SF_K.riseTauMs * Math.log(1 - thr / e);
    if (first) ctx.moveTo(xOf(e), yOf(t));
    else ctx.lineTo(xOf(e), yOf(t));
    first = false;
  }
  ctx.stroke();
  // block zone
  ctx.fillStyle = withAlpha(th.bad, 0.1);
  ctx.fillRect(x0, y0, xOf(thr) - x0, y1 - y0);
  txt(ctx, L('阻滞', 'block'), (x0 + xOf(thr)) / 2, y0 + 14, th.bad, 'center', 10.5, 700);
  // distributions (normal and current)
  const gauss = (mu, sd, color, label) => {
    ctx.strokeStyle = color;
    ctx.fillStyle = withAlpha(color, 0.15);
    ctx.beginPath();
    ctx.moveTo(xOf(Math.max(0, mu - 4 * sd)), y1);
    for (let e = Math.max(0, mu - 4 * sd); e <= Math.min(eMax, mu + 4 * sd); e += 0.1) ctx.lineTo(xOf(e), y1 - 40 * Math.exp(-((e - mu) ** 2) / (2 * sd * sd)));
    ctx.lineTo(xOf(Math.min(eMax, mu + 4 * sd)), y1);
    ctx.fill();
    ctx.stroke();
    txt(ctx, label, xOf(mu), y1 - 46, color, 'center', 10, 700);
  };
  gauss(r.sfN.epp, r.sfN.eppSd, th.normal, L('正常', 'normal'));
  if (r.c.disease !== 'normal') gauss(r.sf.epp, r.sf.eppSd, th.bad, L('当前', 'current'));
  for (const e of [15, 20, 30, 40]) txt(ctx, `${e}`, xOf(e), y1 + 14, th.muted, 'center', 10);
  for (const t of [0, 0.4, 0.8, 1.2]) txt(ctx, `${t}`, x0 - 6, yOf(t) + 4, th.muted, 'right', 10);
  txt(ctx, L('EPP（mV）', 'EPP (mV)'), (x0 + x1) / 2, h - 8, th.muted, 'center', 10);
  txt(ctx, L('达阈时间（ms）；曲线 = EPP 指数上升达阈所需时间（示意 τ）', 'Time to threshold (ms); curve = time for an exponentially rising EPP to reach threshold (illustrative τ)'), x0, 16, th.muted, 'left', 10.5, 600);
}

function drawIpiPlot(ctx, w, h, r, lang) {
  const th = theme();
  const x0 = 54;
  const x1 = w - 16;
  const y0 = 26;
  const y1 = h - 34;
  axes(ctx, x0, y0, x1, y1, th);
  const vals = r.sf.ipi.filter((v) => v !== null);
  const valsN = r.sfN.ipi.filter((v) => v !== null);
  const all = [...vals, ...valsN];
  const mid = valsN.reduce((s, v) => s + v, 0) / valsN.length;
  const span = Math.max(0.15, ...all.map((v) => Math.abs(v - mid))) * 1.15;
  const yOf = (v) => (y0 + y1) / 2 - ((v - mid) / span) * ((y1 - y0) / 2);
  const n = r.sf.ipi.length;
  const xOf = (i) => x0 + ((x1 - x0) * (i + 0.5)) / n;
  r.sfN.ipi.forEach((v, i) => {
    if (v === null) return;
    ctx.fillStyle = withAlpha(th.normal, 0.8);
    ctx.fillRect(xOf(i) - 1.5, yOf(v) - 1.5, 3, 3);
  });
  r.sf.ipi.forEach((v, i) => {
    if (v === null) {
      txt(ctx, '×', xOf(i), y1 - 4, th.bad, 'center', 10, 700);
      return;
    }
    ctx.fillStyle = th.trace;
    ctx.beginPath();
    ctx.arc(xOf(i), yOf(v), 2.2, 0, Math.PI * 2);
    ctx.fill();
  });
  for (const d of [-span, 0, span]) txt(ctx, `${d >= 0 ? '+' : ''}${(d * 1000).toFixed(0)} µs`, x0 - 4, yOf(mid + d) + 4, th.muted, 'right', 9.5);
  txt(ctx, L(`IPI 相对正常均值的偏移；蓝点 = 当前（MCD ${fmt(r.sf.mcd, 0)} µs），灰点 = 正常（MCD ${fmt(r.sfN.mcd, 0)} µs）`, `IPI offset from the normal mean; blue = current (MCD ${fmt(r.sf.mcd, 0)} µs), grey = normal (MCD ${fmt(r.sfN.mcd, 0)} µs)`), x0, 16, th.muted, 'left', 10.5, 600);
  txt(ctx, L('放电序号 1 → 100', 'discharge 1 → 100'), (x0 + x1) / 2, h - 10, th.muted, 'center', 10);
}

function chainRNS(r, c) {
  const t = r.trains[0];
  const f = diseaseFactors(c.disease, c.severity);
  const lesion = {
    normal: L('正常神经肌肉接头。', 'Normal neuromuscular junction.'),
    mg: L(`突触后 ACh 受体减少（模型：受体因子 ${fmt(f.receptor, 2)}）。`, `Fewer postsynaptic ACh receptors (model receptor factor ${fmt(f.receptor, 2)}).`),
    lems: L(`突触前电压门控钙通道受损 → 释放概率 p 降低（模型 ×${fmt(f.release, 2)}）。`, `Presynaptic voltage-gated Ca channels impaired → lower release probability p (model ×${fmt(f.release, 2)}).`),
    botulism: L(`突触前 ACh 释放受阻（模型：p ×${fmt(f.release, 2)}）。`, `Presynaptic ACh release blocked (model: p ×${fmt(f.release, 2)}).`),
    reinn: L(`再支配早期的不成熟终板，安全系数低（模型：受体因子 ${fmt(f.receptor, 2)}）。`, `Immature endplates early in reinnervation with a low safety factor (model receptor factor ${fmt(f.receptor, 2)}).`),
  }[c.disease];
  const first = t.res[0];
  const phys = L(`第 1 次刺激：m = p·n = ${first.p.toFixed(2)} × ${first.n.toFixed(0)} = ${first.m.toFixed(0)} 个量子 → 典型纤维 EPP ${first.epp.toFixed(1)} mV（阈值 ${PV.eppThresholdMv} mV）。`, `Stimulus 1: m = p·n = ${first.p.toFixed(2)} × ${first.n.toFixed(0)} = ${first.m.toFixed(0)} quanta → typical-fibre EPP ${first.epp.toFixed(1)} mV (threshold ${PV.eppThresholdMv} mV).`);
  const src = {
    slow: L('3 Hz：钙在两次刺激间已清除（&gt;100 ms），p 不升高；可释放储备 n 逐次下降，1–2 s 后动员储备补充（p.58–59）。安全系数低的纤维先掉到阈值以下 → 不再参与 CMAP。', '3 Hz: Ca is cleared between stimuli (&gt;100 ms), so p does not rise; the available store n falls with each stimulus and the mobilization store resupplies after 1–2 s (p.58–59). Fibres with a low safety factor drop below threshold first → they leave the CMAP.'),
    rapid: L('50 Hz：钙来不及清除而累积 → p 升高，同时 n 消耗（p.60）。原本低于阈值的纤维可被“救回” → 递增；正常人则主要是同步化带来的假性易化（p.61–62）。', '50 Hz: Ca accumulates faster than it is cleared → p rises while n is consumed (p.60). Fibres below threshold can be recruited back → increment; in normals mainly pseudofacilitation from better synchrony (p.61–62).'),
    exercise: L('短暂最大用力（30–50 Hz 放电）相当于一次高频刺激：运动后即刻释放增强（运动后易化，p.60）。', 'Brief maximal exercise (firing 30–50 Hz) acts like rapid stimulation: release is enhanced right afterwards (postexercise facilitation, p.60).'),
    exhaust: L('1 分钟运动后即刻易化，2–4 分钟出现“运动后衰竭”：低频递减加重（p.60）。衰竭的时间形状为示意。', 'After 1 min of exercise: facilitation immediately, then “postexercise exhaustion” at 2–4 min with a worse slow-RNS decrement (p.60). The exhaustion time course is illustrative.'),
  }[c.protocol];
  let wf;
  if (c.protocol === 'slow') wf = L(`第 1 次 CMAP ${fmt(t.amps[0], 1)} mV（正常 ${fmt(r.ref, 1)}），递减 ${fmt(t.dec, 0)}%；最低在第 ${t.amps.slice(0, 6).indexOf(Math.min(...t.amps.slice(0, 6))) + 1} 次。`, `CMAP #1 ${fmt(t.amps[0], 1)} mV (normal ${fmt(r.ref, 1)}), decrement ${fmt(t.dec, 0)}%; lowest at #${t.amps.slice(0, 6).indexOf(Math.min(...t.amps.slice(0, 6))) + 1}.`);
  else if (c.protocol === 'rapid') wf = L(`第 1 次 ${fmt(t.amps[0], 1)} mV → 最高 ${fmt(Math.max(...t.amps), 1)} mV（递增 ${fmt(t.inc, 0)}%），最后一次 ${fmt(t.amps[t.amps.length - 1], 1)} mV。`, `#1 ${fmt(t.amps[0], 1)} mV → peak ${fmt(Math.max(...t.amps), 1)} mV (increment ${fmt(t.inc, 0)}%), last ${fmt(t.amps[t.amps.length - 1], 1)} mV.`);
  else if (c.protocol === 'exercise') wf = L(`运动前 ${fmt(r.trains[0].amps[0], 1)} mV → 运动后 ${fmt(r.trains[1].amps[0], 1)} mV（${r.exInc >= 0 ? '+' : ''}${fmt(r.exInc, 0)}%）。`, `Before ${fmt(r.trains[0].amps[0], 1)} mV → after ${fmt(r.trains[1].amps[0], 1)} mV (${r.exInc >= 0 ? '+' : ''}${fmt(r.exInc, 0)}%).`);
  else wf = L(`递减：运动前 ${fmt(r.trains[0].dec, 0)}%，运动后 ${r.trains.slice(1).map((x) => `${x.min} 分 ${fmt(x.dec, 0)}%`).join('、')}。`, `Decrement: baseline ${fmt(r.trains[0].dec, 0)}%, after exercise ${r.trains.slice(1).map((x) => `${x.min} min ${fmt(x.dec, 0)}%`).join(', ')}.`);
  let interp;
  const lowBase = t.amps[0] < 0.6 * r.ref;
  if (c.disease === 'normal') interp = L('正常：低频无递减；高频或运动后最多为假性易化（≤40%，面积基本不变，p.61–62）。', 'Normal: no decrement at slow rates; at most pseudofacilitation with rapid RNS or exercise (≤40%, area roughly unchanged, p.61–62).');
  else if (lowBase) interp = L('静息 CMAP 低 + 低频递减 + 高频/运动后显著递增（常 &gt;100%）→ 突触前模式（p.65, p.268）。', 'Low resting CMAP + slow-RNS decrement + marked increment after rapid RNS/exercise (often &gt;100%) → presynaptic pattern (p.65, p.268).');
  else if (c.protocol === 'slow' && t.dec > PV.decrementCut) interp = L('CMAP 正常 + 低频递减 &gt;10% → 符合突触后病变（如 MG）；但递减也见于运动神经元病/再支配、肌强直与代谢性肌病（p.65）。', 'Normal CMAP + slow-RNS decrement &gt;10% → consistent with a postsynaptic disorder (e.g. MG); but decrements also occur in MND/reinnervation, myotonic and metabolic myopathies (p.65).');
  else interp = L('此方案下改变不明显；可换低频方案、近端肌或运动后衰竭方案提高检出（p.62–63）。', 'Little change with this protocol; slow RNS, proximal muscles or the exhaustion protocol raise the yield (p.62–63).');
  return [lesion, phys, src, wf, interp];
}

function chainSF(r, c) {
  const s = r.sf;
  return [
    L(`${L(DISEASES[c.disease])}；同一运动单位的两根肌纤维。`, `${L(DISEASES[c.disease])}; two muscle fibres of one motor unit.`),
    L(`约 10 Hz 随意放电时每次释放约 ${s.m.toFixed(0)} 个量子，量子数随机波动 → EPP ${s.epp.toFixed(1)} ± ${s.eppSd.toFixed(1)} mV（阈值 ${PV.eppThresholdMv} mV）。`, `At ≈10 Hz voluntary firing each impulse releases ≈${s.m.toFixed(0)} quanta with random variation → EPP ${s.epp.toFixed(1)} ± ${s.eppSd.toFixed(1)} mV (threshold ${PV.eppThresholdMv} mV).`),
    L('EPP 达到阈值所需的时间取决于 EPP 大小；接近阈值时曲线最陡 → 传递时间变异变大；低于阈值则不产生动作电位（p.658）。', 'The time for the EPP to reach threshold depends on its size; near threshold the curve is steepest → transmission time varies more; below threshold no action potential (p.658).'),
    L(`电极记录两根纤维的电位；电位间间隔的变化 = 抖动：MCD ${fmt(s.mcd, 0)} µs（正常模型 ${fmt(r.sfN.mcd, 0)} µs），阻滞 ${s.blockPct.toFixed(0)}%。`, `The electrode records both fibres; the variation of the interpotential interval = jitter: MCD ${fmt(s.mcd, 0)} µs (normal model ${fmt(r.sfN.mcd, 0)} µs), blocking ${s.blockPct.toFixed(0)}%.`),
    L('抖动增加提示 NMJ 传递不稳定；阻滞与无力相关，通常在 MCD &gt;80–100 µs 时出现（p.658, 660）。SFEMG 不能区分 MG 与 LEMS（p.662），也见于肌病与再支配（p.681, 250）——敏感但不特异。', 'Increased jitter means insecure NMJ transmission; blocking correlates with weakness and usually appears when MCD &gt;80–100 µs (p.658, 660). SFEMG cannot separate MG from LEMS (p.662) and is also abnormal in myopathy and reinnervation (p.681, 250) — sensitive but not specific.'),
  ];
}

function explain(r, c) {
  if (r.study === 'sfemg') {
    return {
      chain: chainSF(r, c),
      measures: {
        cols: [L('正常模型', 'Normal model'), L('当前', 'Current')],
        rows: [
          { label: 'MCD', unit: 'µs', vals: [r.sfN.mcd, r.sf.mcd], digits: 0, hl: true },
          { label: L('阻滞', 'Blocking'), unit: '%', vals: [r.sfN.blockPct, r.sf.blockPct], digits: 0, flag: ['', r.sf.blockPct > 0 ? 'bad' : ''] },
          { label: L('平均 EPP', 'Mean EPP'), unit: 'mV', vals: [r.sfN.epp, r.sf.epp], digits: 1 },
          { label: L('EPP / 阈值（安全系数）', 'EPP / threshold (safety factor)'), vals: [r.sfN.epp / PV.eppThresholdMv, r.sf.epp / PV.eppThresholdMv], digits: 2 },
        ],
        note: L('MCD 由 100 次模拟放电计算（教科书：50–100 次，p.659）。正常值依年龄与肌肉而异（表 37.3，本应用不复制）；此处只与同一模型的正常状态比较。EPP 上升时间常数为示意参数。', 'MCD from 100 simulated discharges (textbook: 50–100, p.659). Normal limits depend on age and muscle (Table 37.3, not reproduced here); compare only with the same model’s normal state. The EPP rise time constant is illustrative.'),
      },
      caveat: L('<p>SFEMG 需要把低频滤波提高到 500–1000 Hz，记录针尖 200–300 µm 内的纤维（p.659）。异常定义：平均 MCD 超过正常上限或 &gt;10% 的纤维对超限（p.660）。抖动增加本身没有临床对应，阻滞才与无力相关（p.658）。</p>', '<p>SFEMG raises the low-frequency filter to 500–1000 Hz and records fibres within 200–300 µm of the tip (p.659). Abnormal: mean MCD above the limit, or &gt;10% of pairs above it (p.660). Increased jitter alone has no clinical correlate; blocking correlates with weakness (p.658).</p>'),
      sources: L('来源：p.57–60, 250, 658–662, 681。', 'Sources: p.57–60, 250, 658–662, 681.'),
    };
  }
  const t = r.trains[0];
  const rows = [
    { label: L('第 1 次 CMAP', 'CMAP #1'), unit: 'mV', vals: [r.ref, t.amps[0]], digits: 1, hl: true, flag: ['', t.amps[0] < 0.6 * r.ref ? 'bad' : ''] },
  ];
  if (c.protocol === 'slow' || c.protocol === 'exhaust') rows.push({ label: L('递减（第 1→最低，前 5 次）', 'Decrement (#1 → lowest of first 5)'), unit: '%', vals: [r.trainsN[0].dec, t.dec], digits: 0, flag: ['', t.dec > PV.decrementCut ? 'bad' : ''] });
  if (c.protocol === 'rapid') rows.push({ label: L('递增（最高 vs 第 1 次）', 'Increment (highest vs #1)'), unit: '%', vals: [r.trainsN[0].inc, t.inc], digits: 0, flag: ['', t.inc > PV.incrementPresyn ? 'bad' : t.inc > PV.incrementPseudo ? 'warn' : ''] });
  if (c.protocol === 'rapid') rows.push({ label: L('最后一次 / 第 1 次', 'Last / first'), unit: '%', vals: [(100 * r.trainsN[0].amps.at(-1)) / r.trainsN[0].amps[0], (100 * t.amps.at(-1)) / t.amps[0]], digits: 0 });
  if (c.protocol === 'exercise') rows.push({ label: L('运动后变化', 'Change after exercise'), unit: '%', vals: [(100 * (r.trainsN[1].amps[0] - r.trainsN[0].amps[0])) / r.trainsN[0].amps[0], r.exInc], digits: 0, flag: ['', r.exInc > PV.incrementPresyn ? 'bad' : r.exInc > PV.incrementPseudo ? 'warn' : ''] });
  if (c.protocol === 'exhaust') r.trains.slice(1).forEach((x, i) => rows.push({ label: L(`递减：运动后 ${x.min} 分`, `Decrement: ${x.min} min after`), unit: '%', vals: [r.trainsN[i + 1].dec, x.dec], digits: 0, flag: ['', x.dec > PV.decrementCut ? 'bad' : ''] }));
  return {
    chain: chainRNS(r, c),
    measures: {
      cols: [L('正常', 'Normal'), L('当前', 'Current')],
      rows,
      note: L('递减 % = (基线 − 最低)/基线；递增 % = (最高 − 基线)/基线（p.64–65）。判读界限（10%、40%、100%）来自教科书；CMAP 均由生成波形测得。', 'Decrement % = (baseline − lowest)/baseline; increment % = (highest − baseline)/baseline (p.64–65). Cut-offs (10%, 40%, 100%) are from the textbook; CMAPs are measured from the generated waveforms.'),
    },
    caveat: L('<p>技术要点（p.62–63）：刺激必须超强（次强刺激会造成假递减/递增）；肢体固定；肢体温度 ≥33 °C（冷却减轻递减）；检查前停用溴吡斯的明 3–4 小时；近端肌检出率更高。递减并非 NMJ 病特有：运动神经元病/失神经–再支配、肌强直与代谢性肌病也可出现（p.65）。肉毒中毒的递增通常小于 LEMS。</p>', '<p>Technique (p.62–63): stimuli must be supramaximal (submaximal stimulation causes false decrement/increment); immobilise the limb; keep it ≥33 °C (cooling lessens the decrement); hold pyridostigmine 3–4 h; proximal muscles have higher yield. A decrement is not unique to NMJ disease: MND/denervation–reinnervation, myotonic and metabolic myopathies can show it (p.65). Increments in botulism are usually smaller than in LEMS.</p>'),
    sources: L('来源：p.57–65, 268。', 'Sources: p.57–65, 268.'),
  };
}

function why(prev, cur) {
  const k = prev.changed;
  const t = {
    disease: L('换了病变：改变的是 NMJ 的哪一侧——突触后（受体因子）或突触前（释放概率 p）。', 'Changed the disorder: which side of the NMJ is affected — postsynaptic (receptor factor) or presynaptic (release probability p).'),
    severity: L('改变了严重度：安全系数随之改变，更多（或更少）纤维落在阈值附近。', 'Changed severity: the safety factor changes, so more (or fewer) fibres sit near threshold.'),
    protocol: L('换了刺激方案：频率决定钙是否累积（p 升高）以及储备 n 消耗多快。', 'Changed protocol: the rate decides whether Ca accumulates (p rises) and how fast the store n is used.'),
    study: L('换了检查方法：RNS 计数“多少纤维达阈”，SFEMG 测量“达阈时间是否稳定”。', 'Changed method: RNS counts how many fibres reach threshold; SFEMG measures how stable the time to threshold is.'),

  if (s.study === 'motor') {

    const m = measureCompound(sig, { kind: 'cmap', onsetThr: VISUAL_DIV * gain });
    const nAct = raw.arrivals.filter((a) => a.reason !== 'not stimulated').length;
    return { sig, m, gain, nAct, nTot: subj.nerve.motor.length, band };

  const raw = synthSNAP({ nerve: subj.nerve, prep: sc.prep, lesion, stimPos: POS.WRIST, intensity: I, sweepMs: 12, scale: subj.snapScale });

function cvAt(c, tempC) {
  if (c.study !== 'motor') {
    const r = record({ ...c, stim: 'wrist' }, { tempC, intensity: 60, offset: 0, filter: 'standard', gainIdx: 2 });
    return r.m.present ? (POS.WRIST - POS.RING_G1) / r.m.onset : null;
  }
  const w = record({ ...c, stim: 'wrist' }, { tempC, intensity: 60, offset: 0, filter: 'standard', gainIdx: 2 });
  const e = record({ ...c, stim: 'elbow' }, { tempC, intensity: 60, offset: 0, filter: 'standard', gainIdx: 2 });
  return w.m.present && e.m.present ? (POS.ELBOW - POS.WRIST) / (e.m.onset - w.m.onset) : null;
}

  const subj = getSubject(c.seed || 1);
